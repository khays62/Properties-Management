databases:
  - name: omniproperties-db
    databaseName: omniproperties
    user: omniproperties
    plan: 0.5c-1g
    region: oregon
    diskSizeGB: 10
    ipAllowList: []

services:
  - type: web
    name: omniproperties-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements/production.txt && python manage.py collectstatic --noinput --settings=config.settings.production
    preDeployCommand: python manage.py migrate --noinput --settings=config.settings.production
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: omniproperties-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://omniproperties-frontend.onrender.com
      - key: CORS_ALLOW_CREDENTIALS
        value: "False"
      - key: CSRF_TRUSTED_ORIGINS
        value: https://omniproperties-api.onrender.com,https://omniproperties-frontend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: omniproperties-db
          property: connectionString
      - key: TIME_ZONE
        value: Africa/Mogadishu
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.resend.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: resend
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: FRONTEND_BASE_URL
        value: https://omniproperties-frontend.onrender.com
      - key: PASSWORD_RESET_TIMEOUT
        value: "86400"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: SECURE_HSTS_PRELOAD
        value: "False"
      - key: SECURE_CONTENT_TYPE_NOSNIFF
        value: "True"
      - key: SECURE_REFERRER_POLICY
        value: strict-origin-when-cross-origin
      - key: SECURE_PROXY_SSL_HEADER
        value: HTTP_X_FORWARDED_PROTO,https
      - key: MEDIA_STORAGE_BACKEND
        value: s3
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  - type: web
    name: omniproperties-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://omniproperties-api.onrender.com/api/v1/
